# Rename `app` to your own app name before `fly launch --copy-config`.
app = "jev-mcp"
primary_region = "iad"

[build]

[env]
  JEV_DB_PATH = "/data/jev.db"
  JEV_PORT = "8080"

[mounts]
  source = "jev_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
