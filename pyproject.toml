[project]
name = "jev-mcp"
version = "0.1.0"
description = "Self-hostable MCP server that lets AI agents save, document, and re-run TypeSafe Jev queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3",
    "typesafe-sdk>=0.7.0,<1",
    "pydantic>=2.12",
    "starlette>=0.48",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx2>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"jev_mcp/guide.py" = ["E501"]  # markdown tables in the agent guide cannot wrap
